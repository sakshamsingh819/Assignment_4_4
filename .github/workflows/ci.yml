name: CI and Automated Log Summarization

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Run Benchmark Suite
        run: |
          python -m src.benchmark

      - name: Demonstrate Error Log Diagnostics
        if: always()
        run: |
          python -m src.cli summarize data/sample_logs/large_ci_build_failure.log --format markdown

